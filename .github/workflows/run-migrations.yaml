name: Run Supabase migrations

# Applies new files in supabase/migrations/ to the hosted project. Runs on every
# push to main that touches that directory (i.e. when a PR adding a migration is
# merged), so the database is updated alongside the Vercel deploy of the same
# commit. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# Two merges in quick succession queue up rather than pushing concurrently.
# Never cancel: stopping a push part-way through is worse than waiting.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

env:
  NODE_VERSION: '24.10.0'

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The CLI comes from the project's own dependencies, so it is the same
      # version as local development and the test-db job in ci.yaml.
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      # The CLI reads SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD from the
      # environment. `db push` has no --project-ref flag; it pushes to the linked
      # project, so link first.
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Missing secret SUPABASE_DB_PASSWORD}"
          : "${SUPABASE_PROJECT_REF:?Missing secret SUPABASE_PROJECT_REF}"

          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --yes
          npx supabase migration list --linked
