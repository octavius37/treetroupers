# Local Supabase stack for Tree Troupers.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# Ports are offset from the CLI defaults (54321+) so this stack can coexist with
# another local Supabase project without collisions.

project_id = "tree-troupers"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
# Match the hosted project's Postgres major version.
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1:54421"

# Catches outbound mail locally; no real email is ever sent from this stack.
# (Mailpit — the CLI renamed this section from [inbucket] to [local_smtp].)
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "https://127.0.0.1:3000", "http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Matches the hosted project (Authentication → Providers → Email) and the
# 8-character check on /register and /reset-password.
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# On, as in the hosted project: new sign-ups get a confirmation email (locally
# it lands in Mailpit, http://127.0.0.1:54424). Seeded users and the DB tests'
# throwaway users are created already confirmed, so they sign in straight away.
enable_confirmations = true
secure_password_change = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
